name: CI quiz-app

on:
  pull_request:
    paths:
      - "modulo-02-quiz-github-prd/quiz-app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "modulo-02-quiz-github-prd/quiz-app/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modulo-02-quiz-github-prd/quiz-app

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modulo-02-quiz-github-prd/quiz-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modulo-02-quiz-github-prd/quiz-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: modulo-02-quiz-github-prd/quiz-app/playwright-report
          retention-days: 7
